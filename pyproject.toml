[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exfuzzy-atlas"
version = "0.1.0"
description = "Fuzzy-rule atlas over open environmental and urban data, built on the ex_fuzzy library."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = [
    # Contract v0.7 serves mixture-of-rules classifiers (inference='mixture'; ex-fuzzy 3.4.0 is the first release with
    # them, PR 44) and contract v0.8 the ordinal ("at least / at most") and compound conditions of ex-fuzzy 3.5.0
    # (PR 45; the code of commit 7a0844a plus the version bump, docs/reproduce.md). With the options off 3.5.0 is
    # bit-for-bit 3.4.0, which is bit-for-bit 3.3.1 in the default (winning-rule) inference of the served models.
    "ex-fuzzy==3.5.0",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
    "duckdb>=1.1",
    "pytz>=2023.3",  # DuckDB needs it to return TIMESTAMPTZ values to Python; pandas 3 no longer pulls it in
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
# Polygon handling for zone geometries (mobility): GEOS >= 3.14 via shapely 2.2 for coverage_clean.
geo = ["shapely>=2.2", "pyproj>=3.6", "pyshp>=2.3"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5", "shapely>=2.2", "pyproj>=3.6", "pyshp>=2.3"]

[tool.setuptools.packages.find]
where = ["src", "apps/api"]

[tool.setuptools.package-data]
"atlas.contracts" = ["schemas/*.json"]

[tool.pytest.ini_options]
# No editable install on purpose: each git worktree must import its own src/.
pythonpath = ["src", "apps/api"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["apps/web"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["atlas", "atlas_api"]
